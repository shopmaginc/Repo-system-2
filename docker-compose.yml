services:
  postgres:
    image: postgres:15-alpine
    container_name: repo-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repo}
      POSTGRES_DB: ${POSTGRES_DB:-repo_system}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repo-system-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repo} -d ${POSTGRES_DB:-repo_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repo-system-pgdata:
